
name: parakh
description: "Parakh - AI-powered animal feed analysis"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  flutter_tts: ^4.2.5
  pdf: ^3.13.1
  printing: ^5.15.1
  firebase_core: ^4.15.0
  firebase_app_check: ^0.4.8
  firebase_ai: ^4.0.0
  flutter_classic_bluetooth: ^1.4.1
  permission_handler: 11.4.0
  tflite_flutter: ^0.12.1
  image: ^4.10.1
  speech_to_text: ^7.5.0
  tutorial_coach_mark: ^1.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# App launcher icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/parakh_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/parakh_logo.png

# Native launch screen configuration
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/parakh_logo.png
  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/parakh_logo.png
    - assets/images/sakhi.png
    - assets/images/animals/
    - assets/images/breeds/cows/
    - assets/images/breeds/buffaloes/
    - assets/models/
